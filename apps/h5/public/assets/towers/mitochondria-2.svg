    <radialGradient id="mito-core"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#aaccff"/><stop offset="100%" stop-color="#3358aa" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- 氛围圆（更大） -->
  <circle cx="64" cy="64" r="60" fill="url(#mito-amb)"/>
  <!-- 外发光膜（虚线） -->
