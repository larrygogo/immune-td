    <path d="M 22 50 Q 32 42 42 50 Q 52 58 62 50"/>
    <path d="M 58 50 Q 68 42 78 50 Q 88 58 98 50 Q 104 54 106 50"/>
    <path d="M 22 60 Q 34 54 46 60 Q 58 66 70 60 Q 82 54 94 60 Q 102 64 106 60"/>
