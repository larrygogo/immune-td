<?xml version="1.0" encoding="UTF-8"?>
<!--
  微观防线 logo · 显微镜视野风
  外圆 = 物镜视野边界，十字准星 + 刻度 = graticule 分划板，
  中心 = 巨噬细胞（伪足 + 胞核），径向渐变 + 有机曲线，贴合 DESIGN_SYSTEM 规范。
  设计尺寸 128×128，单色主青 #5de0b5。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- 细胞体径向渐变：中心亮，边缘暗，有生物质感 -->
    <radialGradient id="cellBody" cx="42%" cy="38%">
      <stop offset="0%"  stop-color="#8ff5d2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#5de0b5" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#2a8a72" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0d3d33" stop-opacity="0.25"/>
    </radialGradient>
    <!-- 胞核高亮 -->
    <radialGradient id="nucleus" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8ff5d2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2a8a72" stop-opacity="0.2"/>
    </radialGradient>
    <clipPath id="fov">
      <circle cx="64" cy="64" r="62"/>
    </clipPath>
  </defs>

  <!-- 物镜视野：外圆（双线，主细描边 + 极淡填充） -->
  <circle cx="64" cy="64" r="62" stroke="#5de0b5" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="64" cy="64" r="58" stroke="#5de0b5" stroke-width="0.5" stroke-opacity="0.22"/>

  <!-- Graticule 分划板（裁剪在视野内） -->
  <g clip-path="url(#fov)" stroke="#5de0b5" stroke-opacity="0.35" stroke-width="0.5" fill="none">
    <!-- 十字准星 -->
    <line x1="2" y1="64" x2="126" y2="64"/>
    <line x1="64" y1="2" x2="64" y2="126"/>
    <!-- 内部聚焦虚线圈 -->
    <circle cx="64" cy="64" r="32" stroke-dasharray="1 3" stroke-opacity="0.55"/>
    <circle cx="64" cy="64" r="46" stroke-dasharray="1 5" stroke-opacity="0.35"/>
    <!-- 刻度：横纵 8 个小刻度 -->
    <g>
      <line x1="14" y1="62" x2="14" y2="66"/>
      <line x1="26" y1="63" x2="26" y2="65"/>
      <line x1="38" y1="62" x2="38" y2="66"/>
      <line x1="50" y1="63" x2="50" y2="65"/>
      <line x1="78" y1="63" x2="78" y2="65"/>
      <line x1="90" y1="62" x2="90" y2="66"/>
      <line x1="102" y1="63" x2="102" y2="65"/>
      <line x1="114" y1="62" x2="114" y2="66"/>
      <line x1="62" y1="14" x2="66" y2="14"/>
      <line x1="63" y1="26" x2="65" y2="26"/>
      <line x1="62" y1="38" x2="66" y2="38"/>
      <line x1="63" y1="50" x2="65" y2="50"/>
      <line x1="63" y1="78" x2="65" y2="78"/>
      <line x1="62" y1="90" x2="66" y2="90"/>
      <line x1="63" y1="102" x2="65" y2="102"/>
      <line x1="62" y1="114" x2="66" y2="114"/>
    </g>
  </g>

  <!-- 巨噬细胞本体：不规则边缘 + 伪足 -->
  <g clip-path="url(#fov)">
    <!-- 胞膜外围淡光晕 -->
    <circle cx="64" cy="64" r="26" fill="#5de0b5" fill-opacity="0.08"/>
    <!-- 细胞主体（有机曲线，不规则边缘 = 伪足探出感） -->
    <path d="
      M 64 40
      Q 78 38 84 48
      Q 92 54 86 64
      Q 94 72 84 80
      Q 78 92 64 88
      Q 50 92 44 82
      Q 34 76 40 66
      Q 32 56 42 48
      Q 50 38 64 40 Z"
      fill="url(#cellBody)" stroke="#5de0b5" stroke-width="1" stroke-opacity="0.7"/>
    <!-- 细小伪足（短触须，4 根） -->
    <g stroke="#5de0b5" stroke-width="0.8" stroke-opacity="0.55" fill="none" stroke-linecap="round">
      <path d="M 64 40 Q 66 34 64 28"/>
      <path d="M 86 52 Q 92 50 96 46"/>
      <path d="M 86 78 Q 92 80 94 84"/>
      <path d="M 44 80 Q 38 84 34 86"/>
    </g>
    <!-- 胞核 -->
    <circle cx="60" cy="62" r="8" fill="url(#nucleus)"/>
    <circle cx="60" cy="62" r="8" stroke="#5de0b5" stroke-width="0.5" stroke-opacity="0.6"/>
    <!-- 核仁 -->
    <circle cx="62" cy="60" r="2" fill="#8ff5d2" fill-opacity="0.8"/>
    <!-- 胞质颗粒（小点缀，传达"充满活性细胞器"） -->
    <g fill="#5de0b5" fill-opacity="0.5">
      <circle cx="72" cy="56" r="0.8"/>
      <circle cx="76" cy="70" r="0.6"/>
      <circle cx="52" cy="74" r="0.7"/>
      <circle cx="50" cy="56" r="0.6"/>
    </g>
  </g>

  <!-- 右下角 scale bar（"20 μm"） -->
  <g stroke="#5de0b5" stroke-opacity="0.55">
    <line x1="100" y1="116" x2="118" y2="116" stroke-width="1"/>
    <line x1="100" y1="114" x2="100" y2="118" stroke-width="0.6"/>
    <line x1="118" y1="114" x2="118" y2="118" stroke-width="0.6"/>
  </g>
  <text x="109" y="124" font-family="'IBM Plex Mono', monospace" font-size="5"
    fill="#5de0b5" fill-opacity="0.6" text-anchor="middle" letter-spacing="0.1em">20μm</text>

  <!-- 左上角标签 "SPECIMEN" -->
  <text x="8" y="12" font-family="'IBM Plex Mono', monospace" font-size="4.5"
    fill="#5de0b5" fill-opacity="0.5" letter-spacing="0.2em">SPECIMEN</text>
</svg>
